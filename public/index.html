<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N1</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #root {
        display: flex;
      }
      /* Inputs draw their own focus state; drop the browser's focus ring. */
      input:focus,
      input:focus-visible,
      textarea:focus,
      textarea:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
